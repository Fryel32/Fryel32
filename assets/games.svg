    </linearGradient>
  </defs>

  <rect width="1000" height="410" rx="28" fill="url(#bg)"/>

  <text x="55" y="65"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="30"
        font-weight="700"
        fill="#F8FAFC">
    Game Corner
  </text>

  <text x="55" y="95"
