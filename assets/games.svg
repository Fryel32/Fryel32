<svg width="1000" height="410" viewBox="0 0 1000 410" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="1" stop-color="#172B46"/>
    </linearGradient>

    <linearGradient id="line" x1="50" y1="50" x2="950" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8EC5FF"/>
